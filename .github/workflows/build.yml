name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, for compile verification)
        run: |
          xcodebuild -project FilingApp.xcodeproj \
            -scheme FilingApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild -project FilingApp.xcodeproj \
            -scheme FilingApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FilingApp.app"
          if [ ! -d "$APP_PATH" ]; then
            # 尝试 Debug 路径
            APP_PATH=$(find build/Build/Products -name "FilingApp.app" -type d | head -1)
          fi
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FilingApp-unsigned.ipa Payload
          ls -la FilingApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilingApp-unsigned-ipa
          path: FilingApp-unsigned.ipa
          retention-days: 30
